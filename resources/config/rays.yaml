rays:
  logging:
    level: INFO
    loggers:
      github.com/BeamFoundry/rays/: DEBUG
      github.com/BeamFoundry/rays-fiber/: DEBUG
      github.com/BeamFoundry/rays-boilerplate/: DEBUG
  fiber:
    servers:
      primary:
        address: ":3000"
        cache:
          expiration: 1h
          cacheControl: true
        logger:
          timeFormat: "2006/01/02 15:04:05.000"
          format: "${time} FIBER ${reqHeader:host} | ${method} | ${status} | ${url} | ${bytesSent} | \"${locals:httpPolicy}\"\n"
        rewrite:
          rules:
            /apple-touch-icon.png: /static/images/favicon/apple-touch-icon.png
            /favicon-32x32.png: /static/images/favicon/favicon-32x32.png
            /favicon-16x16.png: /static/images/favicon/favicon-16x16.png
            /favicon.ico: /static/images/favicon/favicon.ico
        static:
          browse: true
